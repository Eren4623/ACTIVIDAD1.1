<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">
        <title>Receta: Tacos al pastor</title>
    </head>

    <body>
        <h1>Tcoas al pastor</h1>
        <h2>Ingredientes:</h2>
        <ul>
            <li>Carne de cerdo (500gr)</li>
            <li>Piña (1 taza)</li>
                <ul>
                    <li>cortada en cubos pequeños</li>
                </ul>
            <li>Tortillas de maiz</li>
        </ul>
        <h2>Preparación:</h2>
        <o1>
            <li>Marinar la carne por 2 horas.</li>
            <li>Asar a fuego medio</li>
        </o1>
        <p>¡sirve con cilantro y cebolla (ambos finamente picados)!</p>
    </body>
</html>
